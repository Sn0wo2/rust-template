name: Rust Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
      version:
        type: string
      snapshot:
        type: boolean
        default: true

permissions:
  contents: read

env:
  GORELEASER_CURRENT_TAG: ${{ inputs.version && format('v{0}', inputs.version) }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-windows
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
            artifacts: |
              dist/*.tar.gz
              dist/*.zip
          - platform: macos
            os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            artifacts: dist/*_darwin_*.tar.gz
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install cargo-edit
        if: ${{ !inputs.snapshot }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Sync workspace version
        if: ${{ !inputs.snapshot }}
        run: cargo set-version --workspace "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install mingw-w64
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Set up Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2

      - name: Ensure build script is executable
        if: runner.os == 'Linux'
        run: chmod +x scripts/cargo-or-zigbuild.js

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Package archives
        run: ${{ inputs.snapshot && 'make release-snapshot' || 'make release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.platform }}-builds
          path: ${{ matrix.artifacts }}
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
